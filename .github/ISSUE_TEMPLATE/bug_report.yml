name: Bug report
description: Report something in the portfolio that is broken or surprising.
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make this portfolio better. Keep the report short, but include enough detail to reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest steps that show the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Add screenshots, recordings, or console output if they help explain the issue.
    validations:
      required: false
